    jumpbox:
      hosts:
        localhost:
          ansible_connection: local
    vm:
      children:
        control:
          hosts:
            server:
              local_hostname: server
              instance_id: server
              ansible_host: 192.168.123.10
              ansible_user: ansible
          vars:
            vcpus: 1
            memory: 2048
        worker:
          hosts:
            node-0:
              local_hostname: node-0
              instance_id: node-0
              ansible_host: 192.168.123.11
