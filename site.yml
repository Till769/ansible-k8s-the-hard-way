- name: Jumpbox aufsetzen
  hosts: jumpbox
  roles:
    - jumpbox

- name: VMs erstellen
  hosts: jumpbox
  roles:
    - role: vm
      tags: vm

- name: VMs konfigurieren
  hosts: vm
  roles:
    - role: setup
      tags: setup

- name: Certificate generate
  hosts: jumpbox
  roles:
    - role: certificates
      tags: cert

- name: Certificate deploy
  hosts: vm
  roles:
    - role: certificates_deploy
      tags: cert_deploy

- name: kubeconfig generate
  hosts: jumpbox
  roles:
    - role: kubeconfig
      tags: kubeconfig
