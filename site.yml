- name: Jumpbox aufsetzen
  hosts: jumpbox
  roles:
    - role: jumpbox
      tags: jumpbox


- name: VMs erstellen
  hosts: jumpbox
  roles:
    - role: vm
      tags: vm
  become: true

- name: VMs konfigurieren
  hosts: vm
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait until VMs are reachable
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - role: setup
      tags: setup

- name: Setup lokal host
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - setup

- name: Certificate generate
  hosts: jumpbox
  roles:
    - role: certificates
      tags: cert

- name: Certificate deploy
  hosts: vm
  roles:
    - role: certificates_deploy
      tags: cert_deploy

- name: kubeconfig generate
  hosts: jumpbox
  roles:
    - role: kubeconfig
      tags: kubeconfig

- name: kubeconfig deploy
  hosts: vm
  roles:
    - role: kubeconfig_deploy
      tags: kube_deploy

- name: encryption configuration
  hosts: vm
  roles:
    - role: encryption_config
      tags: encrypt_conf


- name: bootstrap etcd
  hosts: control
  roles:
    - role: etcd
      tags: etcd

- name: bootstrap control-plane
  hosts: control
  roles:
    - role: control_plane
      tags: control_plane

- name: bootstrap worker nodes
  hosts: worker
  roles:
    - role: worker_nodes
      tags: worker_nodes
  become: true

- name: verify worker
  hosts: control
  tags: worker_nodes
  tasks:
    - name: list the kubernetes nodes
      ansible.builtin.command: kubectl get nodes --kubeconfig /home/{{ ansible_user }}/admin.kubeconfig
      become: true

- name: provision pod network routes
  hosts: vm
  become: true
  tags: routes
  tasks:
    - name: add routes to pod subnet of other workers
      ansible.builtin.command:
        cmd: >
          ip route replace {{ hostvars[item].pod_subnet }}
          via {{ hostvars[item].ansible_host }}
      loop: "{{ groups['worker'] | difference([inventory_hostname]) }}"
    - name: show routes
      ansible.builtin.command: ip route
      register: r
    - ansible.builtin.debug: var=r.stdout_lines

- name: smoke test
  hosts: jumpbox
  roles:
    - role: smoke
      tags: smoke
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/admin-remote.kubeconfig"
