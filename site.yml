- name: Jumpbox aufsetzen
  hosts: jumpbox
  roles:
    - jumpbox

- name: VMs erstellen
  hosts: jumpbox
  roles:
    - role: vm
      tags: vm

- name: VMs konfigurieren
  hosts: vm
  roles:
    - role: setup
      tags: setup

- name: Setup lokal host 
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - setup

- name: Certificate generate
  hosts: jumpbox
  roles:
    - role: certificates
      tags: cert

- name: Certificate deploy
  hosts: vm
  roles:
    - role: certificates_deploy
      tags: cert_deploy

- name: kubeconfig generate
  hosts: jumpbox
  roles:
    - role: kubeconfig
      tags: kubeconfig

- name: kubeconfig deploy
  hosts: vm
  roles:
    - role: kubeconfig_deploy
      tags: kube_deploy

- name: encryption configuration
  hosts: vm
  roles:
    - role: encryption_config
      tags: encrypt_conf


- name: bootstrap etcd
  hosts: control
  roles:
    - role: etcd
      tags: etcd

- name: bootstrap control-plane
  hosts: control
  roles:
    - role: control_plane
      tags: control_plane
