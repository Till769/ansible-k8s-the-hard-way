- name: copy and install etcd
  ansible.builtin.copy:
    src: "{{ download_dir }}/controller/etcd"
    dest: /usr/local/bin/etcd
    mode: "0755"
  become: true

- name: copy and install etcdctl
  ansible.builtin.copy:
    src: "{{ download_dir }}/client/etcdctl"
    dest: /usr/local/bin/etcdctl
    mode: "0755"
  become: true

- name: create /etc/etcd/ folder
  ansible.builtin.file:
    path: "/etc/etcd"
    state: directory
    mode: "0755"
  become: true

- name: create /var/lib/etcd/ folder
  ansible.builtin.file:
    path: "/var/lib/etcd"
    state: directory
    mode: "0700"
  become: true

- name: copy ca.crt
  ansible.builtin.copy:
    src: "/home/{{ ansible_user }}/ca.crt"
    dest: /etc/etcd/
    mode: "0644"
    remote_src: true
  become: true

- name: copy kube-api-server.key
  ansible.builtin.copy:
    src: "/home/{{ ansible_user }}/kube-api-server.key"
    dest: /etc/etcd/
    mode: "0644"
    remote_src: true
  become: true

- name: copy kube-api-server.crt
  ansible.builtin.copy:
    src: "/home/{{ ansible_user }}/kube-api-server.crt"
    dest: /etc/etcd/
    mode: "0644"
    remote_src: true
  become: true

- name: copy and install etcd.service
  ansible.builtin.copy:
    src: etcd.service
    dest: /etc/systemd/system/
    mode: "0755"
  become: true

- name: start etcd server
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    state: started
    name: etcd.service
  become: true

- name: verification etcd 
  ansible.builtin.shell: etcdctl member list
  become: true
