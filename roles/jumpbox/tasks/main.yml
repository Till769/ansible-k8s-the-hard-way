- name: apt-get update
  ansible.builtin.apt:
    update_cache: yes
  become: true

- name: apt upgrade
  ansible.builtin.apt:
    name: "*"
    state: latest
  become: true

- name: apt install
  ansible.builtin.apt:
    pkg:
    - bridge-utils
    - cpu-checker
    - libvirt-clients
    - libvirt-dev
    - libvirt-daemon
    - libvirt-daemon-system
    - virtinst
    - qemu-kvm
    - pkg-config
  become: true

- name: Download-Verzeichnis anlegen
  ansible.builtin.file:
    path: "{{ download_dir }}"
    state: directory
    mode: "0755"

- name: Download k8sTHW Binarys
  ansible.builtin.get_url:
    url: "{{ item }}"
    dest: "{{ download_dir }}/"
    mode: "0644"
  loop:
    - "https://dl.k8s.io/{{ k8s_version }}/bin/linux/amd64/kubectl"
    - "https://dl.k8s.io/{{ k8s_version }}/bin/linux/amd64/kube-apiserver"
    - "https://dl.k8s.io/{{ k8s_version }}/bin/linux/amd64/kube-controller-manager"
    - "https://dl.k8s.io/{{ k8s_version }}/bin/linux/amd64/kube-scheduler"
    - "https://dl.k8s.io/{{ k8s_version }}/bin/linux/amd64/kube-proxy"
    - "https://dl.k8s.io/{{ k8s_version }}/bin/linux/amd64/kubelet"

- name: Download component archives
  ansible.builtin.get_url:
    url: "{{ item.value.url }}"
    dest: "{{ download_dir }}/"
    mode: "0644"
  loop: "{{ components | dict2items }}"
  loop_control:
    label: "{{ item.key }} {{ item.value.version }}"


- name: Packages-Verzeichnis anlegen
  ansible.builtin.file:
    path: "{{ download_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - client
    - cni-plugins
    - controller
    - worker

- name: Unarchive critcl Packages
  ansible.builtin.unarchive:
    src: "{{ download_dir}}/crictl-{{ components.crictl.version }}-linux-amd64.tar.gz"
    dest: "{{ download_dir}}/worker"

- name: Unarchive containerd Packages
  ansible.builtin.unarchive:
    src: "{{ download_dir}}/containerd-{{ components.containerd.version }}-linux-amd64.tar.gz"
    dest: "{{ download_dir}}/worker"
    extra_opts:
      - --strip-components=1

- name: Unarchive cni-plugin Packages
  ansible.builtin.unarchive:
    src: "{{ download_dir}}/cni-plugins-linux-amd64-{{ components.cni_plugin.version }}.tgz"
    dest: "{{ download_dir}}/cni-plugins"

- name: Unarchive etcd Packages
  ansible.builtin.unarchive:
    src: "{{ download_dir}}/etcd-{{ components.etcd.version }}-linux-amd64.tar.gz"
    dest: "{{ download_dir}}"
    extra_opts:
      - --strip-components=1

- name: Move etcdctl Ordner
  ansible.builtin.command: mv downloads/etcdctl downloads/client/

- name: Move kubectl Ordner
  ansible.builtin.command: mv downloads/kubectl downloads/client/

- name: Move etcd Ordner
  ansible.builtin.command: mv downloads/etcd downloads/controller/

- name: Move kube-apiserver Ordner
  ansible.builtin.command: mv downloads/kube-apiserver downloads/controller/

- name: Move kube-controller-manager Ordner
  ansible.builtin.command: mv downloads/kube-controller-manager downloads/controller/

- name: Move kube-scheduler Ordner
  ansible.builtin.command: mv downloads/kube-scheduler downloads/controller/

- name: Move kubelet Ordner
  ansible.builtin.command: mv downloads/kubelet downloads/worker/

- name: Move kube-proxy Ordner
  ansible.builtin.command: mv downloads/kube-proxy downloads/worker/

- name: Move runc Ordner
  ansible.builtin.command: mv downloads/runc.amd64 downloads/worker/runc

- name: Make Binarys ausführbar
  ansible.builtin.file:
    path: "{{ download_dir }}/{{ item }}"
    state: directory
    recurse: true
    mode: '0755'
  loop:
    - client
    - cni-plugins
    - controller
    - worker

- name: Kopiere Binary
  ansible.builtin.copy:
    src: "{{ download_dir }}/client/kubectl"
    dest: /usr/local/bin
    mode: '0755'
  become: true

- name: kubectl version abfragen
  ansible.builtin.command:
    cmd: "kubectl version --client -o json"
  register: kubectl_version
  changed_when: false

- name: kubectl version verifizieren
  ansible.builtin.assert:
    that:
      - (kubectl_version.stdout | from_json).clientVersion.gitVersion == k8s_version
