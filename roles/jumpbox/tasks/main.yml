- name: Install virtualization packages
  ansible.builtin.apt:
    pkg:
    - bridge-utils
    - cpu-checker
    - libvirt-clients
    - libvirt-dev
    - libvirt-daemon
    - libvirt-daemon-system
    - virtinst
    - qemu-kvm
    - pkg-config
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Download-Verzeichnis anlegen
  ansible.builtin.file:
    path: "{{ download_dir }}"
    state: directory
    mode: "0755"

- name: Packages-Verzeichnis anlegen
  ansible.builtin.file:
    path: "{{ download_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - client
    - cni-plugins
    - controller
    - worker
    - archive

- name: Download k8sTHW Binarys
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/{{ k8s_version }}/bin/linux/amd64/{{ item.key }}"
    dest: "{{ download_dir }}/{{ item.value }}/{{ item.key }}"
    checksum: "sha256:https://dl.k8s.io/{{ k8s_version }}/bin/linux/amd64/{{ item.key }}.sha256"
    mode: "0755"
  loop: "{{ k8s_binaries | dict2items }}"

- name: Download component archives
  ansible.builtin.get_url:
    url: "{{ item.value.url }}"
    dest: "{{ download_dir }}/archive/{{ item.value.url | basename}}"
    mode: "0644"
    checksum: "sha256:{{ item.value.url }}.sha256"
  loop: "{{ components | dict2items | selectattr('value.extract', 'defined') }}"
  loop_control:
    label: "{{ item.key }} {{ item.value.version }}"

- name: Download component binaries
  ansible.builtin.get_url:
    url: "{{ item.value.url }}"
    dest: "{{ download_dir }}/{{ item.value.url | basename}}"
    mode: "0644"
    checksum: "sha256:{{ item.value.url }}.sha256"
  loop: "{{ components | dict2items | selectattr('value.dest', 'defined') }}"
  loop_control:
    label: "{{ item.key }} {{ item.value.version }}"

- name: Unarchive component packages
  ansible.builtin.unarchive:
    src: "{{ download_dir }}/archive/{{ item.0.value.url | basename }}"
    dest: "{{ download_dir }}/{{ item.1.to }}"
    include: "{{ item.1.include | default(omit) }}"
    extra_opts: "{{ ['--strip-components=' ~ item.1.strip_components] if item.1.strip_components is defined else omit }}"
    creates: "{{ download_dir }}/{{ item.1.to }}/{{ item.1.creates }}"
  loop: "{{ components | dict2items | selectattr('value.extract', 'defined') | subelements('value.extract') }}"
  loop_control:
    label: "{{ item.0.key }} -> {{ item.1.to }}"

- name: Copy kubectl biinary
  ansible.builtin.copy:
    src: "{{ download_dir }}/client/kubectl"
    dest: /usr/local/bin
    mode: '0755'
  become: true

- name: kubectl version abfragen
  ansible.builtin.command:
    cmd: "kubectl version --client -o json"
  register: kubectl_version
  changed_when: false

- name: kubectl version verifizieren
  ansible.builtin.assert:
    that:
      - (kubectl_version.stdout | from_json).clientVersion.gitVersion == k8s_version
