- name: copy kubelet-config
  ansible.builtin.copy:
    src: "kubelet-config.yaml"
    dest: "/home/{{ ansible_user }}/"
    mode: "0644"

- name: install os dependencies
  ansible.builtin.apt:
    update_cache: yes
    pkg:
      - socat
      - conntrack
      - ipset
      - kmod

- name: create folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/cni/net.d
    - /opt/cni/bin
    - /var/lib/kubelet
    - /var/lib/kube-proxy
    - /var/lib/kubernetes
    - /var/run/kubernetes
    - /etc/containerd

- name: install crictl, kube-proxy, kubelet, runc
  ansible.builtin.copy:
    src: "{{ download_dir }}/worker/{{ item }}"
    dest: /usr/local/bin/
    mode: "0755"
  loop:
    - crictl
    - kube-proxy
    - kubelet
    - runc

- name: install containerd containerd-shim-runc-v2 containerd-stress
  ansible.builtin.copy:
    src: "{{ download_dir }}/worker/{{ item }}"
    dest: /bin/
    mode: "0755"
  loop:
    - containerd
    - containerd-shim-runc-v2
    - containerd-stress

- name: install cni-plugins
  ansible.builtin.copy:
    src: "{{ download_dir }}/cni-plugins/"
    dest: /opt/cni/bin/
    mode: "0755"

- name: write 10-bridge.conf to hosts
  ansible.builtin.template:
    src: 10-bridge.conf.j2
    dest: "/etc/cni/net.d/10-bridge.conf"
    mode: "0644"

- name: copy 99-loopback.conf
  ansible.builtin.copy:
    src: "99-loopback.conf"
    dest: "/etc/cni/net.d/"
    mode: "0644"

- name: load br-netfilter
  community.general.modprobe:
    name: br_netfilter
    persistent: "present"

- name: configure sysctl for kubernetes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    reload: true
    sysctl_file: /etc/sysctl.d/kubernetes.conf
  loop: "{{ worker_sysctl | dict2items }}"

- name: install containerd config
  ansible.builtin.copy:
    src: "containerd-config.toml"
    dest: "/etc/containerd/config.toml"
    mode: "0644"

- name: install containerd
  ansible.builtin.copy:
    src: "containerd.service"
    dest: "/etc/systemd/system/"
    mode: "0755"

- name: install kubelet config
  ansible.builtin.copy:
    src: "kubelet-config.yaml"
    dest: "/var/lib/kubelet/"
    mode: "0644"

- name: install kubelet
  ansible.builtin.copy:
    src: "kubelet.service"
    dest: "/etc/systemd/system/"
    mode: "0755"

- name: install kube-proxy config
  ansible.builtin.copy:
    src: "kube-proxy-config.yaml"
    dest: "/var/lib/kube-proxy/"
    mode: "0644"

- name: install kube-proxy
  ansible.builtin.copy:
    src: "kube-proxy.service"
    dest: "/etc/systemd/system/"
    mode: "0755"

- name: start containerd
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    state: started
    name: containerd.service

- name: start kubelet
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    state: started
    name: kubelet.service

- name: start kube-proxy
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    state: started
    name: kube-proxy.service
