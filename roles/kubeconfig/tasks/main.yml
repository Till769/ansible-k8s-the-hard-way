- name: Create kubeconfig Directory in Playbook_dir
  ansible.builtin.file:
    path: "{{ kubeconfig_dir }}"
    state: directory

- name: Render component and remote kubeconfigs
  ansible.builtin.template:
    src: kubeconfig.yaml.j2
    dest: "{{ kubeconfig_dir }}/{{ item.name }}.kubeconfig"
    mode: "0600"
  vars:
    kc_user: "{{ item.user }}"
    kc_cert: "{{ item.cert | default(item.name) }}"
    kc_server: "{{ item.server | default(cluster_api_endpoint) }}"
  loop: "{{ kubeconfigs }}"

- name: Render node kubeconfigs
  ansible.builtin.template:
    src: kubeconfig.yaml.j2
    dest: "{{ kubeconfig_dir }}/{{ item}}.kubeconfig"
    mode: "0600"
  vars:
    kc_user: "system:node:{{ item}}"
    kc_cert: "{{ item}}"
    kc_server: "{{ cluster_api_endpoint }}"
  loop: "{{ groups['worker'] }}"
