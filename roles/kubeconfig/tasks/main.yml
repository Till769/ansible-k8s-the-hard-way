- name: Create kubeconfig Directory in Playbook_dir
  ansible.builtin.file:
    path: "{{ kubeconfig_dir }}"
    state: directory

- name: Render component kubeconfigs
  ansible.builtin.template:
    src: kubeconfig.yaml.j2
    dest: "{{ kubeconfig_dir }}/{{ item.name }}.kubeconfig"
    mode: "0600"
  vars:
    kc_user: "{{ item.user }}"
    kc_cert: "{{ item.name }}"
    kc_server: "{{ item.server | default(cluster_api_endpoint) }}"
  loop: "{{ kubeconfigs }}"

- name: Render node kubeconfigs
  ansible.builtin.template:
    src: kubeconfig.yaml.j2
    dest: "{{ kubeconfig_dir }}/{{ item}}.kubeconfig"
    mode: "0600"
  vars:
    kc_user: "system:node:{{ item}}"
    kc_cert: "{{ item}}"
    kc_server: "{{ cluster_api_endpoint }}"
  loop: "{{ groups['worker'] }}"

- name: local set cluster in kubeconfig
  ansible.builtin.command:
    cmd: >
      kubectl config set-cluster kubernetes-the-hard-way
      --certificate-authority={{ pki_dir }}/ca.crt
      --embed-certs=true
      --server=https://server.kubernetes.local:6443

- name: local credentials in kubeconfig
  ansible.builtin.command:
    cmd: >
      kubectl config set-credentials admin
      --client-certificate={{ pki_dir }}/admin.crt
      --client-key={{ pki_dir }}/admin.key

- name: local set context in kubeconfig
  ansible.builtin.command:
    cmd: >
      kubectl config set-context kubernetes-the-hard-way
      --cluster=kubernetes-the-hard-way
      --user=admin

- name: local use context in kubeconfig
  ansible.builtin.command:
    cmd: >
      kubectl config use-context kubernetes-the-hard-way
