- name: Create pki Directory in Playbook_dir
  ansible.builtin.file:
    path: "{{ pki_dir }}"
    state: directory

- name: Generate Private RSA 4096 Key
  community.crypto.openssl_privatekey:
    path: "{{ pki_dir }}/ca.key"
    size: "{{ ca_config.size }}"
    type: "{{ ca_config.type }}"
    regenerate: "fail"

- name: Check if CA certificate exists
  ansible.builtin.stat:
    path: "{{ pki_dir }}/ca.crt"
  register: ca_cert_stat

- name: Generate CA-CSR and CA-Certificate when not present
  when: not ca_cert_stat.stat.exists
  block:
  - name: Generate CA-CSR
    community.crypto.openssl_csr_pipe:
      common_name: "{{ ca_config.common_name }}"
      basic_constraints: "{{ ca_config.basic_constraints }}"
      basic_constraints_critical: "{{ ca_config.basic_constraints_critical }}"
      key_usage: "{{ ca_config.key_usage }}"
      privatekey_path: "{{ pki_dir }}/ca.key"
      key_usage_critical: "{{ ca_config.key_usage_critical }}"
    register: ca_csr

  - name: Generatie CA-Certificate
    community.crypto.x509_certificate:
      provider: selfsigned
      csr_content: "{{ ca_csr.csr }}"
      selfsigned_not_after: "{{ ca_config.selfsigned_not_after }}"
      path: "{{ pki_dir }}/ca.crt"
      privatekey_path: "{{ pki_dir }}/ca.key"

- name: Generate Private Keys for Client and Server
  community.crypto.openssl_privatekey:
    path: "{{ pki_dir }}/{{ item }}.key"
    size: 4096
    type: "RSA"
  loop: "{{ certs }}"

- name: Generate Client Certificates
  ansible.builtin.command:
    cmd: >
      openssl req -new -sha256
      -key {{ pki_dir }}/{{ item }}.key
      -config {{ role_path }}/files/ca.conf
      -section {{ item }}
      -out {{ pki_dir }}/{{ item }}.csr
    creates: "{{ pki_dir }}/{{ item }}.csr"
  loop: "{{ certs }}"

- name: Generate Server Certificates
  ansible.builtin.command:
    cmd: >
      openssl x509 -req -days 3653
      -in {{ pki_dir }}/{{ item }}.csr
      -copy_extensions copyall
      -sha256 -CA {{ pki_dir }}/ca.crt
      -CAkey {{ pki_dir }}/ca.key
      -CAcreateserial
      -out {{ pki_dir }}/{{ item }}.crt
    creates: "{{ pki_dir }}/{{ item }}.crt"
  loop: "{{ certs }}"
