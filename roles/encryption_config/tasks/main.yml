- name: generate or read encryption key
  ansible.builtin.set_fact:
    encryption_key: >-
      {{ lookup('ansible.builtin.password', pki_dir + '/encryption-key', length=32) }}
    no_log: true
  delegate_to: localhost
  run_once: true

- name: generate encryption config
  ansible.builtin.template:
    src: encryption-config.yaml.j2
    dest: "{{ pki_dir }}/encryption-config.yaml"
    mode: "0600"
  delegate_to: localhost
  run_once: true

- name: deploy encryption config to control server
  when: "'control' in group_names"
  ansible.builtin.copy:
    src: "{{ pki_dir }}/encryption-config.yaml"
    dest: "/home/{{ ansible_user }}/encryption-config.yaml"
    mode: "0600"

