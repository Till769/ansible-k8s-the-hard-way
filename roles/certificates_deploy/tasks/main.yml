- name: Distribute Certificates to worker nodes
  when: "'worker' in group_names"
  block:
    - name: Create /var/lib/kubelet directory
      ansible.builtin.file:
        path: /var/lib/kubelet
        state: directory
        mode: "0755"
      become: true

    - name: copy CA Certificate
      ansible.builtin.copy:
        src: "{{ pki_dir }}/ca.crt"
        dest: /var/lib/kubelet/ca.crt
        mode: "0644"
      become: true

    - name: copy kubelet Certificate
      ansible.builtin.copy:
        src: "{{ pki_dir }}/{{ inventory_hostname }}.crt"
        dest: /var/lib/kubelet/kubelet.crt
        mode: "0644"
      become: true

    - name: copy kubelet private key 
      ansible.builtin.copy:
        src: "{{ pki_dir }}/{{ inventory_hostname }}.key"
        dest: /var/lib/kubelet/kubelet.key
        mode: "0644"
      become: true

- name: DIstribute certificates to server
  when: "'control' in group_names"
  block:
    - name: Copy server certificates and keys
      ansible.builtin.copy:
        src: "{{ pki_dir }}/{{ item }}"
        dest: "/home/{{ ansible_user }}/{{ item }}"
        mode: "0600"
      loop:
        - ca.key
        - ca.crt
        - kube-api-server.key
        - kube-api-server.crt
        - service-accounts.key
        - service-accounts.crt
      become: true
